name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml
      - .github/workflows/windows-release.yml

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$'
          if ($null -eq $match) {
            throw 'Could not read the Windows version from pubspec.yaml.'
          }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --reporter compact

      - name: Build Windows release
        run: flutter build windows --release --split-debug-info=build\symbols\windows

      - name: Install smoke-test tools
        run: choco install ripgrep -y --no-progress

      - name: Build installer and portable archive
        shell: pwsh
        run: .\windows\qa\smoke_windows.ps1 -SkipBuild

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            'release\windows\YurichConnect_Setup.exe',
            'release\windows\YurichConnect_Windows_Portable.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath 'release\windows\SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $notes = @"
          ## Yurich Connect for Windows v$version

          - XHTTP removed from the Windows UI, imports, and cached profiles.
          - Subscription refresh now replaces stale profiles and prevents duplicates.
          - Deleted profiles stay deleted across subscription refreshes and credential rotation.
          - Advanced TUN and Windows system proxy can no longer create double routing.
          - Explicit Always through VPN rules override Developer and Codex exclusions.
          - Hysteria latency no longer uses an invalid TCP probe.
          - Startup cache recovery, subscription limits, installer safety, and runtime stability improved.

          Проверено: Flutter analyze, tests, Windows release build, installer smoke-test and payload safety scan.
          "@

          if (gh release view $tag --repo '${{ github.repository }}' *> $null) {
            gh release edit $tag --repo '${{ github.repository }}' --title "Yurich Connect for Windows v$version" --notes $notes
          } else {
            gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Yurich Connect for Windows v$version" --notes $notes
          }

          gh release upload $tag `
            'release\windows\YurichConnect_Setup.exe' `
            'release\windows\YurichConnect_Windows_Portable.zip' `
            'release\windows\SHA256SUMS.txt' `
            --repo '${{ github.repository }}' `
            --clobber
